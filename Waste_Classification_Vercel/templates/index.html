<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Classification using CNN</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Arial, sans-serif; background: linear-gradient(135deg,#11998e,#38ef7d); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { width:90%; max-width:600px; background:#fff; padding:40px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.2); margin:20px 0; }
h1 { color:#16875c; margin-bottom:10px; }
.subtitle { color:#666; margin-bottom:30px; }
input[type=file] { width:100%; padding:15px; margin-bottom:20px; border:2px dashed #38a169; border-radius:10px; }
button { background:#16875c; color:#fff; border:none; padding:14px 30px; border-radius:10px; cursor:pointer; font-size:16px; }
button:hover { background:#0d6846; }
button:disabled { opacity:.6; cursor:wait; }
#preview { max-width:100%; max-height:240px; margin-bottom:16px; border-radius:10px; display:none; }
.result { margin-top:30px; padding:20px; background:#e8fff2; border-radius:15px; color:#155724; display:none; }
.error { margin-top:20px; padding:15px; background:#ffe6e6; color:#a00; border-radius:10px; display:none; }
.bars { text-align:left; margin-top:12px; font-size:14px; }
.bar { background:#cdeedd; border-radius:6px; margin:4px 0; overflow:hidden; }
.bar span { display:block; padding:3px 8px; background:#38a169; color:#fff; white-space:nowrap; }
</style>
</head>
<body>
<div class="container">
  <h1>Waste Classification</h1>
  <p class="subtitle">CNN Based Waste Classification System</p>
  <img id="preview" alt="preview">
  <form id="form">
    <input type="file" id="file" accept="image/*" required>
    <button type="submit" id="btn">Classify Waste</button>
  </form>
  <div class="error" id="error"></div>
  <div class="result" id="result">
    <h2>Prediction Result</h2>
    <p>Waste Type: <strong id="pred"></strong></p>
    <p>Confidence: <strong id="conf"></strong>%</p>
    <div class="bars" id="bars"></div>
  </div>
</div>
<script>
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const errorBox = document.getElementById('error');
const resultBox = document.getElementById('result');
const btn = document.getElementById('btn');

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
});

// Shrink big photos in the browser (Vercel request limit ~4.5 MB)
function shrink(file, max = 640) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not read image')), 'image/jpeg', 0.9);
    };
    img.onerror = () => reject(new Error('Could not read image'));
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.style.display = resultBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Classifying...';
  try {
    const blob = await shrink(fileInput.files[0]);
    const fd = new FormData();
    fd.append('file', blob, 'image.jpg');
    const res = await fetch('/api/predict', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    document.getElementById('pred').textContent = data.prediction;
    document.getElementById('conf').textContent = data.confidence;
    const bars = document.getElementById('bars');
    bars.innerHTML = '';
    Object.entries(data.all).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
      const d = document.createElement('div');
      d.className = 'bar';
      const s = document.createElement('span');
      s.style.width = Math.max(v, 8) + '%';
      s.textContent = k + ' ' + v + '%';
      d.appendChild(s); bars.appendChild(d);
    });
    resultBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Classify Waste';
  }
});
</script>
</body>
</html>
